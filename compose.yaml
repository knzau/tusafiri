services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tusafiri
      POSTGRES_PASSWORD: tusafiri
      POSTGRES_DB: tusafiri
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tusafiri -d tusafiri']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
